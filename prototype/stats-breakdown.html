<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>分类占比 · 个人记账</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">记</div><span>个人记账</span></div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-title">主导航</div>
        <a class="nav-item" href="books.html"><span class="icon">📒</span>账本</a>
        <a class="nav-item" href="transactions.html"><span class="icon">📋</span>收支明细</a>
        <a class="nav-item" href="transaction-new.html"><span class="icon">✏️</span>快速录入</a>
        <a class="nav-item" href="categories.html"><span class="icon">🏷️</span>分类管理</a>
        <a class="nav-item" href="budgets.html"><span class="icon">🎯</span>月度预算</a>
      </div>
      <div class="nav-section">
        <div class="nav-title">报表</div>
        <a class="nav-item" href="stats-monthly.html"><span class="icon">📊</span>月度统计</a>
        <a class="nav-item" href="stats-breakdown.html"><span class="icon">🥧</span>分类占比</a>
        <a class="nav-item" href="stats-trend.html"><span class="icon">📈</span>收支趋势</a>
      </div>
      <div class="nav-section">
        <div class="nav-title">数据</div>
        <a class="nav-item" href="import-export.html"><span class="icon">📁</span>导入导出</a>
      </div>
    </nav>
    <div class="sidebar-foot">v1.0 · 私有部署</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">日常账本 / <b>分类占比</b></div>
      <div class="topbar-right">
        <div class="book-switcher"><span>🏠</span><span class="name">日常账本</span><span style="color:var(--text-tertiary)">▾</span></div>
        <button class="icon-btn" onclick="toggleTheme()">🌓</button>
        <a href="settings.html" style="text-decoration:none"><div class="avatar">A</div></a>
      </div>
    </header>

    <div class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title">分类占比</h1>
          <p class="page-sub">识别主要消费结构</p>
        </div>
        <div style="display:flex;gap:12px">
          <input class="input" type="month" value="2026-06" style="width:160px">
          <select class="select" style="width:140px"><option>支出</option><option>收入</option></select>
        </div>
      </div>

      <div class="card-row c-2">
        <!-- 左侧饼图（纯 SVG） -->
        <div class="card">
          <div class="card-head"><div class="card-title">分布图</div></div>
          <svg viewBox="0 0 200 200" style="width:100%;max-width:280px;margin:0 auto;display:block">
            <circle cx="100" cy="100" r="80" fill="none" stroke="var(--n-100)" stroke-width="32"/>
            <!-- 计算：周长 2πr ≈ 502.65；按 25% / 22% / 10% / 8% / 6% / 29% -->
            <circle cx="100" cy="100" r="80" fill="none" stroke="#3B6EE8" stroke-width="32"
                    stroke-dasharray="125.7 502.65" transform="rotate(-90 100 100)"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#0EA5E9" stroke-width="32"
                    stroke-dasharray="110.6 502.65" stroke-dashoffset="-125.7" transform="rotate(-90 100 100)"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#1FB85B" stroke-width="32"
                    stroke-dasharray="50.3 502.65" stroke-dashoffset="-236.3" transform="rotate(-90 100 100)"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#F5A524" stroke-width="32"
                    stroke-dasharray="40.2 502.65" stroke-dashoffset="-286.6" transform="rotate(-90 100 100)"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#E5484D" stroke-width="32"
                    stroke-dasharray="30.2 502.65" stroke-dashoffset="-326.8" transform="rotate(-90 100 100)"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#6B7585" stroke-width="32"
                    stroke-dasharray="145.7 502.65" stroke-dashoffset="-357.0" transform="rotate(-90 100 100)"/>
            <text x="100" y="95" text-anchor="middle" font-size="14" fill="var(--text-tertiary)">总支出</text>
            <text x="100" y="115" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-primary)" font-family="JetBrains Mono,monospace">¥3,256.80</text>
          </svg>
        </div>

        <!-- 右侧分类明细 -->
        <div class="card">
          <div class="card-head"><div class="card-title">TOP 10 分类</div>
            <span class="tag tag-default">共 6 项</span>
          </div>
          <div class="bar-row">
            <div class="bar-name">🍔 餐饮</div>
            <div class="bar-track"><div class="bar-fill" style="width:35%">¥820.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">🛒 购物</div>
            <div class="bar-track"><div class="bar-fill" style="width:22%;background:var(--info-500)">¥720.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">🚇 交通</div>
            <div class="bar-track"><div class="bar-fill" style="width:10%;background:var(--income-500)">¥320.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">🏠 居家</div>
            <div class="bar-track"><div class="bar-fill" style="width:8%;background:var(--warn-500)">¥240.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">🎮 娱乐</div>
            <div class="bar-track"><div class="bar-fill" style="width:6%;background:var(--expense-500)">¥200.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">💊 医疗</div>
            <div class="bar-track"><div class="bar-fill" style="width:5%;background:var(--n-500)">¥156.00</div></div>
          </div>
          <div class="bar-row">
            <div class="bar-name">其他 8 项</div>
            <div class="bar-track"><div class="bar-fill" style="width:14%;background:var(--n-400)">¥800.80</div></div>
          </div>

          <div style="display:flex;justify-content:space-between;padding-top:16px;margin-top:16px;border-top:1px solid var(--divider);font-size:var(--fs-caption);color:var(--text-tertiary)">
            <span>显示前 10 + 其他合并</span>
            <span>合计 100%</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/app.js"></script>
</body>
</html>
