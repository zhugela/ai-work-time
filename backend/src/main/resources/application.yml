spring:
  application:
    name: jz-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: GMT+8
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8080
  compression:
    enabled: true
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.personal.jz.entity

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha

jz:
  jwt:
    secret: ${JJWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expire-seconds: 604800
    issuer: jz-backend
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  rate-limit:
    enabled: true
    login-per-minute: 5
    api-per-minute: 60
  excel:
    max-rows: 5000
    max-file-mb: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
