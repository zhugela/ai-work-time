spring:
  datasource:
    url: jdbc:h2:mem:jzdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.personal.jz: DEBUG
    org.springframework.security: INFO
